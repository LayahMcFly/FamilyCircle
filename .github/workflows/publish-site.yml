name: Publish site

# Builds the site from the commit on main, stamps it with its release id, checks the stamp, and only then publishes that one artifact to GitHub Pages.
# Needs no secrets and never touches Appwrite. If stamping or validation fails, the deploy job does not run and the live site stays as it was.
# Requires Settings > Pages > Source = "GitHub Actions" (a one-time change made in the browser by the owner).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the release tooling
        run: node --test tests/release-stamp.test.js
      - name: Build, stamp and validate the site
        run: node tools/build-site.js _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
