<!doctype html>
<html lang="en" data-theme="light" data-style="default" data-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Exchange preview (sample data) | Family Circle</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="exchange-preview-step" content="1">

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="../themes.css">

</head>
<body class="pv ex-skin">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="pv-banner" id="pv-banner" role="note"><strong>Preview — sample data, not connected to your family.</strong> <span>Invented people and listings. Nothing here is saved, sent or stored, and it clears when you reload.</span></div>
  <div class="pv-wrap">
    <section class="card pv-controls" id="pv-controls" aria-label="Preview controls"></section>

    <p class="hint pv-build" id="pv-build"></p>
